name: Build IPA (NextPVR, iOS 16 + external display)

on:
  workflow_dispatch:
    inputs:
      bundle_prefix:
        description: "Bundle ID prefix (any value, e.g. com.yourname.streamclient)"
        default: "com.NextPVR.streamclient"
      external_display:
        description: "Enable the external display (adds a scene to Info.plist)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Apply the iOS 16 + external display patch
        run: git apply --whitespace=nowarn ios16-external-display.patch

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Local configuration (Secret.xcconfig)
        env:
          PREFIX: ${{ inputs.bundle_prefix }}
        run: |
          printf 'BUNDLE_ID_PREFIX = %s\nDEVELOPMENT_TEAM =\n' "$PREFIX" > Configs/Secret.xcconfig

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project NexusPVR.xcodeproj -scheme NextPVR \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation -skipMacroValidation \
            -derivedDataPath build build 2>&1 | tee build.log

      - name: Declare the external display scene
        if: ${{ inputs.external_display }}
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          PLIST="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UIApplicationSceneManifest" "$PLIST" || true
          $PB -c "Add :UIApplicationSceneManifest dict" "$PLIST"
          $PB -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool true" "$PLIST"
          $PB -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" "$PLIST"
          for ROLE in UIWindowSceneSessionRoleExternalDisplayNonInteractive UIWindowSceneSessionRoleExternalDisplay; do
            BASE=":UIApplicationSceneManifest:UISceneConfigurations:$ROLE"
            $PB -c "Add $BASE array" "$PLIST"
            $PB -c "Add $BASE:0 dict" "$PLIST"
            $PB -c "Add $BASE:0:UISceneConfigurationName string External Display" "$PLIST"
            $PB -c "Add $BASE:0:UISceneDelegateClassName string ExternalSceneDelegate" "$PLIST"
          done
          plutil -p "$PLIST" | grep -A14 UIApplicationSceneManifest || true
          plutil -p "$PLIST" | grep -E "MinimumOSVersion|CFBundleIdentifier"

      # Why this step exists:
      # The build is unsigned, so the main executable has no entitlements at all.
      # When TrollStore installs an app like that, it signs the main executable with
      # fallback entitlements that include get-task-allow = true, and on iOS 16+ that
      # makes the app require Developer Mode. If the main executable already has
      # entitlements, TrollStore keeps them and adds nothing, so we give it explicit
      # ones with get-task-allow = false.
      # This step runs after the Info.plist changes because the signature covers it.
      - name: Fake-sign with explicit entitlements (no Developer Mode needed)
        run: |
          # ldid: Homebrew first, then the Procursus release binary as a fallback
          LDID=$(command -v ldid || true)
          if [ -z "$LDID" ]; then
            if brew install ldid; then
              LDID=$(command -v ldid)
            else
              ARCH=$(uname -m)
              [ "$ARCH" = "arm64" ] || ARCH=x86_64
              curl -fsSL -o "$RUNNER_TEMP/ldid" \
                "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_$ARCH"
              chmod +x "$RUNNER_TEMP/ldid"
              LDID="$RUNNER_TEMP/ldid"
            fi
          fi
          echo "Using ldid: $LDID"

          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          rm -f "$APP/embedded.mobileprovision"

          # get-task-allow is explicitly false; wifi-info is the same entitlement
          # as in the project's NexusPVR-iOS.entitlements file
          cat > "$RUNNER_TEMP/main-entitlements.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <false/>
            <key>com.apple.developer.networking.wifi-info</key>
            <true/>
          </dict>
          </plist>
          EOF

          "$LDID" -S"$RUNNER_TEMP/main-entitlements.plist" "$APP/$EXEC"

          # Check: print the entitlements and fail if any binary has get-task-allow = true
          BAD=0
          while IFS= read -r -d '' F; do
            file -b "$F" | grep -q 'Mach-O' || continue
            ENT=$("$LDID" -e "$F" 2>/dev/null || true)
            if [ -n "$ENT" ]; then
              echo "### ${F#$APP/}"
              echo "$ENT"
            fi
            V=$(echo "$ENT" | plutil -extract get-task-allow raw -o - - 2>/dev/null || true)
            if [ "$V" = "true" ]; then
              echo "ERROR: get-task-allow = true in ${F#$APP/}"
              BAD=1
            fi
          done < <(find "$APP" -type f -print0)
          exit $BAD

      - name: Signing and entitlements diagnostics
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          {
            echo "== App"
            codesign -dvv --entitlements - "$APP" 2>&1 || true
            for F in "$APP"/Frameworks/*; do
              echo "== $F"
              codesign -dvv --entitlements - "$F" 2>&1 || true
            done
            echo "== Binaries with get-task-allow = true:"
            while IFS= read -r -d '' F; do
              file -b "$F" | grep -q "Mach-O" || continue
              V=$(codesign -d --entitlements :- "$F" 2>/dev/null | plutil -extract get-task-allow raw -o - - 2>/dev/null || true)
              if [ "$V" = "true" ]; then
                echo "$F"
              fi
            done < <(find "$APP" -type f -print0)
            echo "== end"
          } > signing.txt 2>&1
          head -120 signing.txt

      - name: Create the IPA
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry StreamClient-nextpvr-ios16.ipa Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            StreamClient-nextpvr-ios16.ipa
            build.log
            signing.txt
